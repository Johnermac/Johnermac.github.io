<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="S3 replication copies new objects from a versioned source bucket to a versioned destination bucket in the same or another Region, or another account. It does not copy earlier objects, deletes with a version ID, replicas of replicas, or archive-tier objects.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="330" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="250" height="130" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="36" y="44" class="h">SOURCE</text>
  <rect x="40" y="70" width="210" height="58" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="145.0" y="96.0" text-anchor="middle" style="fill:#8fdcd7">Bucket</text>
  <text x="145.0" y="112.0" text-anchor="middle" class="s">versioning on</text>
  <rect x="550" y="20" width="250" height="130" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="566" y="44" class="h">DESTINATION</text>
  <rect x="570" y="70" width="210" height="58" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="675.0" y="96.0" text-anchor="middle" style="fill:#8fdcd7">Bucket</text>
  <text x="675.0" y="112.0" text-anchor="middle" class="s">versioning on</text>
  <line x1="250" y1="99" x2="570" y2="99" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="410" y="90" text-anchor="middle" class="s">new objects, copied automatically</text>
  <text x="410" y="118" text-anchor="middle" class="s">SRR same Region, CRR other Region</text>
  <rect x="20" y="175" width="385" height="140" rx="10" fill="none" stroke="#4cc38a" stroke-width="1"/>
  <text x="36" y="199" class="h" style="fill:#4cc38a">REPLICATED</text>
  <text x="36" y="224" class="s">Objects written after the rule exists</text>
  <text x="36" y="244" class="s">Delete markers, if you enable it</text>
  <text x="36" y="264" class="s">To another account, with a bucket policy</text>
  <text x="36" y="284" class="s">15 minutes, SLA-backed, with RTC</text>
  <rect x="415" y="175" width="385" height="140" rx="10" fill="none" stroke="#f0545c" stroke-width="1"/>
  <text x="431" y="199" class="h" style="fill:#f0545c">NOT REPLICATED</text>
  <text x="431" y="224" class="s">Objects from before the rule (Batch Replication)</text>
  <text x="431" y="244" class="s">Deletes that name a version ID</text>
  <text x="431" y="264" class="s">Replicas of replicas</text>
  <text x="431" y="284" class="s">Glacier Flexible, Deep Archive objects</text>
</svg>
