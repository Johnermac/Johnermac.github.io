<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="S3 versioning for one key. Step 1: two uploads leave version 2 current and version 1 kept. Step 2: a delete without a version ID adds a delete marker as the current version, the object looks gone but both versions remain. Step 3: deleting the marker by its version ID makes version 2 current again.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="320" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="220" height="270" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="34" y="44" class="h">1  TWO UPLOADS</text>
  <rect x="40" y="66" width="180" height="42" rx="6" fill="#4cc38a" fill-opacity="0.14" stroke="#4cc38a" stroke-width="1"/>
  <text x="130.0" y="91.0" text-anchor="middle" style="fill:#9be0bf">v2  current</text>
  <rect x="40" y="118" width="180" height="42" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="130.0" y="143.0" text-anchor="middle" style="fill:#e6e6e6">v1</text>
  <text x="34" y="270" class="s">both versions are kept</text>
  <rect x="300" y="20" width="220" height="270" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="314" y="44" class="h">2  DELETE, NO VERSION ID</text>
  <rect x="320" y="66" width="180" height="42" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="410.0" y="91.0" text-anchor="middle" style="fill:#f5c542">delete marker  current</text>
  <rect x="320" y="118" width="180" height="42" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="410.0" y="143.0" text-anchor="middle" style="fill:#e6e6e6">v2</text>
  <rect x="320" y="170" width="180" height="42" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="410.0" y="195.0" text-anchor="middle" style="fill:#e6e6e6">v1</text>
  <text x="314" y="270" class="s">GET returns 404, data remains</text>
  <rect x="580" y="20" width="220" height="270" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="594" y="44" class="h">3  REMOVE THE MARKER</text>
  <rect x="600" y="66" width="180" height="42" rx="6" fill="#4cc38a" fill-opacity="0.14" stroke="#4cc38a" stroke-width="1"/>
  <text x="690.0" y="91.0" text-anchor="middle" style="fill:#9be0bf">v2  current</text>
  <rect x="600" y="118" width="180" height="42" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="690.0" y="143.0" text-anchor="middle" style="fill:#e6e6e6">v1</text>
  <text x="594" y="270" class="s">the object is back</text>
  <line x1="240" y1="155" x2="300" y2="155" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="520" y1="155" x2="580" y2="155" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
