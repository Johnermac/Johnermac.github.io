<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="An EFS file system is Regional. Instances in three AZs mount it through a mount target in their own AZ, and all see the same files. Files not used for a while move to cheaper storage classes through lifecycle management.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="330" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="560" height="290" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="36" y="44" class="h">VPC IN ONE REGION</text>
  <rect x="40" y="60" width="165" height="160" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="50" y="76" class="s">AZ a</text>
  <rect x="55" y="90" width="135" height="40" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="122.5" y="114.0" text-anchor="middle" style="fill:#a9c8f0">Instances</text>
  <rect x="55" y="160" width="135" height="40" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="122.5" y="177.0" text-anchor="middle" style="fill:#8fdcd7">Mount target</text>
  <text x="122.5" y="193.0" text-anchor="middle" class="s">IP in this subnet</text>
  <line x1="68" y1="130" x2="68" y2="158" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="220" y="60" width="165" height="160" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="230" y="76" class="s">AZ b</text>
  <rect x="235" y="90" width="135" height="40" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="302.5" y="114.0" text-anchor="middle" style="fill:#a9c8f0">Instances</text>
  <rect x="235" y="160" width="135" height="40" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="302.5" y="177.0" text-anchor="middle" style="fill:#8fdcd7">Mount target</text>
  <text x="302.5" y="193.0" text-anchor="middle" class="s">IP in this subnet</text>
  <line x1="248" y1="130" x2="248" y2="158" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="400" y="60" width="165" height="160" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="410" y="76" class="s">AZ c</text>
  <rect x="415" y="90" width="135" height="40" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="482.5" y="114.0" text-anchor="middle" style="fill:#a9c8f0">Instances</text>
  <rect x="415" y="160" width="135" height="40" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="482.5" y="177.0" text-anchor="middle" style="fill:#8fdcd7">Mount target</text>
  <text x="482.5" y="193.0" text-anchor="middle" class="s">IP in this subnet</text>
  <line x1="428" y1="130" x2="428" y2="158" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="245" width="520" height="46" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="300.0" y="265.0" text-anchor="middle" style="fill:#8fdcd7">EFS file system</text>
  <text x="300.0" y="281.0" text-anchor="middle" class="s">one copy of the data, stored across the AZs of the Region</text>
  <line x1="68" y1="202" x2="68" y2="243" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="248" y1="202" x2="248" y2="243" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="428" y1="202" x2="428" y2="243" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="610" y="20" width="190" height="290" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="626" y="44" class="h">STORAGE CLASSES</text>
  <rect x="625" y="64" width="160" height="46" rx="6" fill="#4cc38a" fill-opacity="0.14" stroke="#4cc38a" stroke-width="1"/>
  <text x="705.0" y="84.0" text-anchor="middle" style="fill:#9be0bf">Standard</text>
  <text x="705.0" y="100.0" text-anchor="middle" class="s">frequently used files</text>
  <rect x="625" y="134" width="160" height="46" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="705.0" y="154.0" text-anchor="middle" style="fill:#f5c542">Infrequent Access</text>
  <text x="705.0" y="170.0" text-anchor="middle" class="s">cheaper, read fee</text>
  <rect x="625" y="204" width="160" height="46" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="705.0" y="224.0" text-anchor="middle" style="fill:#e6e6e6">Archive</text>
  <text x="705.0" y="240.0" text-anchor="middle" class="s">cheapest, read fee</text>
  <line x1="705" y1="110" x2="705" y2="134" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="705" y1="180" x2="705" y2="204" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="625" y="274" class="s">lifecycle policy moves files</text>
  <text x="625" y="290" class="s">by days since last access</text>
</svg>
