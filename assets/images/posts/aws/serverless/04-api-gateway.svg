<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="A client calls API Gateway, which authorizes the request, applies throttling, validates it and can serve it from a cache, then passes it to an integration: a Lambda function, an HTTP endpoint, an AWS service API such as SQS or Step Functions, or a private load balancer through a VPC link.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="340" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="140" width="110" height="60" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="75.0" y="167.0" text-anchor="middle" style="fill:#a9c8f0">Client</text>
  <text x="75.0" y="183.0" text-anchor="middle" class="s">HTTPS</text>
  <rect x="170" y="20" width="290" height="300" rx="10" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="190" y="46" class="h" style="fill:#8fdcd7">API GATEWAY</text>
  <rect x="190" y="64" width="250" height="50" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="315.0" y="86.0" text-anchor="middle" style="fill:#e6e6e6">Authorize</text>
  <text x="315.0" y="102.0" text-anchor="middle" class="s">IAM, JWT, Cognito, Lambda</text>
  <rect x="190" y="126" width="250" height="50" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="315.0" y="148.0" text-anchor="middle" style="fill:#e6e6e6">Throttle</text>
  <text x="315.0" y="164.0" text-anchor="middle" class="s">rate, burst, usage plans</text>
  <line x1="315" y1="114" x2="315" y2="126" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="190" y="188" width="250" height="50" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="315.0" y="210.0" text-anchor="middle" style="fill:#e6e6e6">Validate</text>
  <text x="315.0" y="226.0" text-anchor="middle" class="s">request schema</text>
  <line x1="315" y1="176" x2="315" y2="188" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="190" y="250" width="250" height="50" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="315.0" y="272.0" text-anchor="middle" style="fill:#e6e6e6">Cache</text>
  <text x="315.0" y="288.0" text-anchor="middle" class="s">REST APIs only</text>
  <line x1="315" y1="238" x2="315" y2="250" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="130" y1="170" x2="170" y2="170" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#al)"/>
  <rect x="530" y="26" width="270" height="56" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="665.0" y="51.0" text-anchor="middle" style="fill:#a9c8f0">Lambda function</text>
  <text x="665.0" y="67.0" text-anchor="middle" class="s">proxy integration</text>
  <line x1="460" y1="170" x2="530" y2="54" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="530" y="102" width="270" height="56" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="665.0" y="127.0" text-anchor="middle" style="fill:#e6e6e6">HTTP endpoint</text>
  <text x="665.0" y="143.0" text-anchor="middle" class="s">any public URL</text>
  <line x1="460" y1="170" x2="530" y2="130" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="530" y="178" width="270" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="665.0" y="203.0" text-anchor="middle" style="fill:#8fdcd7">AWS service</text>
  <text x="665.0" y="219.0" text-anchor="middle" class="s">SQS, DynamoDB, Step Functions</text>
  <line x1="460" y1="170" x2="530" y2="206" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="530" y="254" width="270" height="56" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="665.0" y="279.0" text-anchor="middle" style="fill:#e6e6e6">VPC link</text>
  <text x="665.0" y="295.0" text-anchor="middle" class="s">private ALB or NLB</text>
  <line x1="460" y1="170" x2="530" y2="282" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
