<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Fan-out: an order service publishes one message to an SNS topic. The topic copies it to three SQS queues. The billing queue takes every event, the email queue only shipped orders, the fraud queue only orders above 1000, each through a filter policy. Each queue feeds its own consumer.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="300" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="122" width="130" height="56" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="85.0" y="147.0" text-anchor="middle" style="fill:#a9c8f0">Order service</text>
  <text x="85.0" y="163.0" text-anchor="middle" class="s">publishes once</text>
  <rect x="200" y="122" width="130" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="265.0" y="147.0" text-anchor="middle" style="fill:#8fdcd7">SNS topic</text>
  <text x="265.0" y="163.0" text-anchor="middle" class="s">order events</text>
  <line x1="150" y1="150" x2="200" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="400" y="30" width="170" height="56" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="485.0" y="55.0" text-anchor="middle" style="fill:#f5c542">Billing queue</text>
  <text x="485.0" y="71.0" text-anchor="middle" class="s">filter: none</text>
  <rect x="640" y="30" width="160" height="56" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="720.0" y="62.0" text-anchor="middle" style="fill:#a9c8f0">Billing</text>
  <line x1="330" y1="150" x2="400" y2="58" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="570" y1="58" x2="640" y2="58" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="400" y="122" width="170" height="56" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="485.0" y="147.0" text-anchor="middle" style="fill:#f5c542">Email queue</text>
  <text x="485.0" y="163.0" text-anchor="middle" class="s">status = shipped</text>
  <rect x="640" y="122" width="160" height="56" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="720.0" y="154.0" text-anchor="middle" style="fill:#a9c8f0">Notifications</text>
  <line x1="330" y1="150" x2="400" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="570" y1="150" x2="640" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="400" y="214" width="170" height="56" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="485.0" y="239.0" text-anchor="middle" style="fill:#f5c542">Fraud queue</text>
  <text x="485.0" y="255.0" text-anchor="middle" class="s">total &gt; 1000</text>
  <rect x="640" y="214" width="160" height="56" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="720.0" y="246.0" text-anchor="middle" style="fill:#a9c8f0">Fraud check</text>
  <line x1="330" y1="150" x2="400" y2="242" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="570" y1="242" x2="640" y2="242" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
