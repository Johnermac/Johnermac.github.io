  <rect x="340" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <rect x="370" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <line x1="85" y1="96" x2="85" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="275" y1="96" x2="275" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="415" y="20" width="385" height="280" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="431" y="46" class="h" style="fill:#4cc38a">CROSS-ZONE ON</text>
  <rect x="430" y="60" width="100" height="36" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="480.0" y="75.0" text-anchor="middle" style="fill:#8fdcd7">node AZ a</text>
  <text x="480.0" y="91.0" text-anchor="middle" class="s">50% of traffic</text>
  <rect x="620" y="60" width="100" height="36" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="670.0" y="75.0" text-anchor="middle" style="fill:#8fdcd7">node AZ b</text>
  <text x="670.0" y="91.0" text-anchor="middle" class="s">50% of traffic</text>
  <rect x="425" y="160" width="110" height="56" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <rect x="545" y="160" width="250" height="56" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="429" y="154" class="s">AZ a</text>
  <text x="549" y="154" class="s">AZ b</text>
  <rect x="439" y="176" width="40" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <rect x="487" y="176" width="40" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <rect x="555" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <rect x="585" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <rect x="615" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
