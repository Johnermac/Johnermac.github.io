  <rect x="675" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <rect x="705" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <rect x="735" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <rect x="765" y="176" width="26" height="28" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <line x1="480" y1="96" x2="480" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="670" y1="96" x2="670" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="480" y1="96" x2="670" y2="160" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <line x1="670" y1="96" x2="480" y2="160" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="40" y="240" style="fill:#f4a0a5">AZ a targets: 25% each</text>
  <text x="40" y="260" style="fill:#f4a0a5">AZ b targets: 6.25% each</text>
  <text x="40" y="284" class="s">each node sends only to its own AZ</text>
  <text x="435" y="240" style="fill:#9be0bf">every target: 10% each</text>
  <text x="435" y="284" class="s">cross-AZ hops can add data transfer charges</text>
</svg>
