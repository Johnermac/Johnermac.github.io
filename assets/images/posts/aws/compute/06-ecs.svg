<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="ECR stores the container image. A task definition describes how to run it. An ECS service keeps the desired number of tasks running on a cluster, on Fargate or on EC2 instances, and registers them with a load balancer.">
