<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="The ECS task execution role is used by the agent before the container starts, to pull the image, write logs and fetch secrets. The task role is used by the application code while it runs. The container cannot use the execution role.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="340" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="780" height="150" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="46" class="h">BEFORE THE CONTAINER STARTS</text>
  <rect x="40" y="76" width="150" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="115.0" y="108.0" text-anchor="middle" style="fill:#8fdcd7">ECS or Fargate agent</text>
  <line x1="190" y1="104" x2="250" y2="104" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="250" y="76" width="190" height="56" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="345.0" y="108.0" text-anchor="middle" style="fill:#f5c542">Task execution role</text>
  <line x1="440" y1="104" x2="500" y2="104" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="500" y="56" width="280" height="30" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="640.0" y="75.0" text-anchor="middle" style="fill:#e6e6e6">ECR: pull the image</text>
  <rect x="500" y="92" width="280" height="30" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="640.0" y="111.0" text-anchor="middle" style="fill:#e6e6e6">CloudWatch Logs: write logs</text>
  <rect x="500" y="128" width="280" height="30" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="640.0" y="147.0" text-anchor="middle" style="fill:#e6e6e6">Secrets: inject into env</text>
  <rect x="20" y="185" width="780" height="140" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="211" class="h">WHILE THE APPLICATION RUNS</text>
  <rect x="40" y="240" width="150" height="56" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="115.0" y="272.0" text-anchor="middle" style="fill:#a9c8f0">Your code</text>
  <line x1="190" y1="268" x2="250" y2="268" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="250" y="240" width="190" height="56" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="345.0" y="272.0" text-anchor="middle" style="fill:#f5c542">Task role</text>
  <line x1="440" y1="268" x2="500" y2="268" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="500" y="248" width="280" height="40" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="640.0" y="272.0" text-anchor="middle" style="fill:#e6e6e6">S3, DynamoDB, SQS and so on</text>
</svg>
