<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Three placement group strategies. Cluster packs instances together in one AZ for low latency. Partition spreads groups of instances across partitions that do not share racks. Spread puts each instance on distinct hardware.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="300" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="250" height="260" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="46" class="h" style="fill:#38b2ac">CLUSTER</text>
  <rect x="40" y="66" width="210" height="110" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="48" y="82" class="s">one rack area, one AZ</text>
  <rect x="52" y="92" width="86" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="95.0" y="113.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="150" y="92" width="86" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="193.0" y="113.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="52" y="132" width="86" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="95.0" y="153.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="150" y="132" width="86" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="193.0" y="153.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <text x="36" y="208" class="s">lowest latency between nodes</text>
  <text x="36" y="226" class="s">10 Gbps per flow, 5 outside</text>
  <text x="36" y="244" class="s">same type, one launch request</text>
  <rect x="285" y="20" width="250" height="260" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="301" y="46" class="h" style="fill:#38b2ac">PARTITION</text>
  <rect x="305" y="66" width="64" height="110" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="337" y="82" text-anchor="middle" class="s">rack 1</text>
  <rect x="313" y="92" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="337.0" y="113.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="313" y="132" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="337.0" y="153.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="375" y="66" width="64" height="110" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="407" y="82" text-anchor="middle" class="s">rack 2</text>
  <rect x="383" y="92" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="407.0" y="113.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="383" y="132" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="407.0" y="153.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="445" y="66" width="64" height="110" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="477" y="82" text-anchor="middle" class="s">rack 3</text>
  <rect x="453" y="92" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="477.0" y="113.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="453" y="132" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="477.0" y="153.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <text x="301" y="208" class="s">up to 7 partitions per AZ</text>
  <text x="301" y="226" class="s">failure stays in one partition</text>
  <text x="301" y="244" class="s">Hadoop, Cassandra, Kafka</text>
  <rect x="550" y="20" width="250" height="260" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="566" y="46" class="h" style="fill:#38b2ac">SPREAD</text>
  <rect x="570" y="66" width="64" height="110" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="602" y="82" text-anchor="middle" class="s">rack 1</text>
  <rect x="578" y="112" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="602.0" y="133.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="640" y="66" width="64" height="110" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="672" y="82" text-anchor="middle" class="s">rack 2</text>
  <rect x="648" y="112" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="672.0" y="133.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <rect x="710" y="66" width="64" height="110" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="742" y="82" text-anchor="middle" class="s">rack 3</text>
  <rect x="718" y="112" width="48" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="742.0" y="133.0" text-anchor="middle" style="fill:#a9c8f0">vm</text>
  <text x="566" y="208" class="s">each instance on its own rack</text>
  <text x="566" y="226" class="s">7 running per AZ per group</text>
  <text x="566" y="244" class="s">small set of critical nodes</text>
</svg>
