<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Sequence for assuming a role. The principal calls STS AssumeRole. STS checks the role trust policy and returns temporary credentials. The principal calls an AWS service with them, and the service checks the role permissions policy.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .n{font-size:10px;font-weight:700;fill:#1e2128}
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/></marker>
  </defs>
  <rect width="820" height="330" rx="12" fill="#1e2128" stroke="#353b45"/>
  <line x1="110" y1="70" x2="110" y2="316" stroke="#4a5260" stroke-dasharray="3 4"/>
  <rect x="30" y="20" width="160" height="44" rx="6" fill="#3d86e0" fill-opacity="0.14" stroke="#3d86e0"/>
  <text x="110" y="38" text-anchor="middle" class="h">PRINCIPAL</text>
  <text x="110" y="55" text-anchor="middle" class="s">user, app, CI job</text>
  <line x1="320" y1="70" x2="320" y2="316" stroke="#4a5260" stroke-dasharray="3 4"/>
  <rect x="240" y="20" width="160" height="44" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac"/>
  <text x="320" y="38" text-anchor="middle" class="h">STS</text>
  <text x="320" y="55" text-anchor="middle" class="s">token service</text>
  <line x1="530" y1="70" x2="530" y2="316" stroke="#4a5260" stroke-dasharray="3 4"/>
  <rect x="450" y="20" width="160" height="44" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e"/>
  <text x="530" y="38" text-anchor="middle" class="h">IAM ROLE</text>
  <text x="530" y="55" text-anchor="middle" class="s">trust + permissions</text>
  <line x1="720" y1="70" x2="720" y2="316" stroke="#4a5260" stroke-dasharray="3 4"/>
  <rect x="640" y="20" width="160" height="44" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac"/>
  <text x="720" y="38" text-anchor="middle" class="h">AWS SERVICE</text>
  <text x="720" y="55" text-anchor="middle" class="s">e.g. S3</text>
  <line x1="116" y1="112" x2="316" y2="112" stroke="#e6e6e6" stroke-width="1.4" marker-end="url(#g)"/>
  <circle cx="128" cy="98" r="8" fill="#f5c542"/><text x="128" y="101.5" text-anchor="middle" class="n">1</text>
  <text x="142" y="102">AssumeRole(role/app)</text>
  <line x1="326" y1="152" x2="526" y2="152" stroke="#e6e6e6" stroke-width="1.4" marker-end="url(#g)"/>
  <circle cx="338" cy="138" r="8" fill="#f5c542"/><text x="338" y="141.5" text-anchor="middle" class="n">2</text>
  <text x="352" y="142">trust policy allows caller?</text>
  <line x1="314" y1="198" x2="114" y2="198" stroke="#e6e6e6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <circle cx="128" cy="184" r="8" fill="#f5c542"/><text x="128" y="187.5" text-anchor="middle" class="n">3</text>
  <text x="142" y="188">temporary credentials</text>
  <text x="142" y="214" class="s">key + secret + session token, expires</text>
  <line x1="116" y1="252" x2="716" y2="252" stroke="#e6e6e6" stroke-width="1.4" marker-end="url(#g)"/>
  <circle cx="128" cy="238" r="8" fill="#f5c542"/><text x="128" y="241.5" text-anchor="middle" class="n">4</text>
  <text x="142" y="242">API call signed with temp credentials</text>
  <line x1="714" y1="292" x2="534" y2="292" stroke="#e6e6e6" stroke-width="1.4" marker-end="url(#g)"/>
  <circle cx="548" cy="278" r="8" fill="#f5c542"/><text x="548" y="281.5" text-anchor="middle" class="n">5</text>
  <text x="562" y="282">permissions policy allows action?</text>
</svg>
