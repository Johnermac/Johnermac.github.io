<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Three overlapping circles: identity policy, permissions boundary, and SCP or RCP. Effective permissions are only the area where all three overlap.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
  </style>
  <defs>
    <clipPath id="cb"><circle cx="355" cy="115" r="95"/></clipPath>
    <clipPath id="cs"><circle cx="300" cy="195" r="95"/></clipPath>
  </defs>
  <rect width="820" height="300" rx="12" fill="#1e2128" stroke="#353b45"/>
  <circle cx="245" cy="115" r="95" fill="#3d86e0" fill-opacity="0.12" stroke="#3d86e0"/>
  <circle cx="355" cy="115" r="95" fill="#8b949e" fill-opacity="0.10" stroke="#8b949e"/>
  <circle cx="300" cy="195" r="95" fill="#38b2ac" fill-opacity="0.12" stroke="#38b2ac"/>
  <g clip-path="url(#cb)"><g clip-path="url(#cs)"><circle cx="245" cy="115" r="95" fill="#f5c542" fill-opacity="0.45"/></g></g>
  <text x="300" y="150" text-anchor="middle" style="font-weight:700;font-size:11px">effective</text>
  <text x="195" y="70" text-anchor="middle" class="s" style="fill:#3d86e0">identity</text>
  <text x="195" y="84" text-anchor="middle" class="s" style="fill:#3d86e0">policy</text>
  <text x="405" y="70" text-anchor="middle" class="s">permissions</text>
  <text x="405" y="84" text-anchor="middle" class="s">boundary</text>
  <text x="300" y="262" text-anchor="middle" class="s" style="fill:#38b2ac">SCP / RCP</text>

  <g transform="translate(520,82)">
    <rect width="12" height="12" rx="3" fill="#3d86e0" fill-opacity="0.35" stroke="#3d86e0"/><text x="22" y="11">identity policy</text><text x="22" y="27" class="s">grants permissions</text>
    <rect y="50" width="12" height="12" rx="3" fill="#8b949e" fill-opacity="0.3" stroke="#8b949e"/><text x="22" y="61">permissions boundary</text><text x="22" y="77" class="s">caps one user or role</text>
    <rect y="100" width="12" height="12" rx="3" fill="#38b2ac" fill-opacity="0.35" stroke="#38b2ac"/><text x="22" y="111">SCP / RCP</text><text x="22" y="127" class="s">caps the whole account</text>
  </g>
</svg>
