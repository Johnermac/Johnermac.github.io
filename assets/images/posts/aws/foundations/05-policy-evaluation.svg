<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 524" width="820" height="524" role="img" aria-label="IAM policy evaluation flowchart. An explicit deny ends in deny. RCPs and SCPs must allow. A same-account resource policy that names the exact principal ends in allow. Otherwise the identity policy, permissions boundary and session policy must all allow, or the result is deny.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:13px;font-weight:700;letter-spacing:2px}
    .n{font-size:11px;font-weight:700;fill:#1e2128}
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0545c"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4cc38a"/></marker>
  </defs>
  <rect width="820" height="524" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="230" y="28" width="360" height="40" rx="6" fill="#f0545c" fill-opacity="0.10" stroke="#f0545c"/>
  <circle cx="250" cy="48.0" r="9" fill="#f0545c"/><text x="250" y="52.0" text-anchor="middle" class="n">1</text>
  <text x="268" y="52.0">Explicit Deny in any policy?</text>
  <line x1="590" y1="48.0" x2="690" y2="48.0" stroke="#f0545c" stroke-width="1.5"/>
  <text x="640.0" y="42.0" text-anchor="middle" class="s" style="fill:#f0545c">yes</text>
  <line x1="410.0" y1="68" x2="410.0" y2="84" stroke="#8b949e" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="418.0" y="81" class="s">no</text>
  <rect x="230" y="86" width="360" height="40" rx="6" fill="#38b2ac" fill-opacity="0.10" stroke="#38b2ac"/>
  <circle cx="250" cy="106.0" r="9" fill="#38b2ac"/><text x="250" y="110.0" text-anchor="middle" class="n">2</text>
  <text x="268" y="110.0">RCPs allow the action?</text>
  <line x1="590" y1="106.0" x2="690" y2="106.0" stroke="#f0545c" stroke-width="1.5"/>
  <text x="640.0" y="100.0" text-anchor="middle" class="s" style="fill:#f0545c">no</text>
  <line x1="410.0" y1="126" x2="410.0" y2="142" stroke="#8b949e" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="418.0" y="139" class="s">yes</text>
  <rect x="230" y="144" width="360" height="40" rx="6" fill="#38b2ac" fill-opacity="0.10" stroke="#38b2ac"/>
  <circle cx="250" cy="164.0" r="9" fill="#38b2ac"/><text x="250" y="168.0" text-anchor="middle" class="n">3</text>
  <text x="268" y="168.0">SCPs allow the action?</text>
  <line x1="590" y1="164.0" x2="690" y2="164.0" stroke="#f0545c" stroke-width="1.5"/>
  <text x="640.0" y="158.0" text-anchor="middle" class="s" style="fill:#f0545c">no</text>
  <line x1="410.0" y1="184" x2="410.0" y2="200" stroke="#8b949e" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="418.0" y="197" class="s">yes</text>
  <rect x="230" y="202" width="360" height="40" rx="6" fill="#3d86e0" fill-opacity="0.10" stroke="#3d86e0"/>
  <circle cx="250" cy="222.0" r="9" fill="#3d86e0"/><text x="250" y="226.0" text-anchor="middle" class="n">4</text>
  <text x="268" y="226.0">Resource policy allows? (same acct)</text>
  <line x1="230" y1="222.0" x2="190" y2="222.0" stroke="#4cc38a" stroke-width="1.5"/>
  <text x="210.0" y="216.0" text-anchor="middle" class="s" style="fill:#4cc38a">yes*</text>
  <line x1="410.0" y1="242" x2="410.0" y2="258" stroke="#8b949e" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="418.0" y="255" class="s">no</text>
  <rect x="230" y="260" width="360" height="40" rx="6" fill="#3d86e0" fill-opacity="0.10" stroke="#3d86e0"/>
  <circle cx="250" cy="280.0" r="9" fill="#3d86e0"/><text x="250" y="284.0" text-anchor="middle" class="n">5</text>
  <text x="268" y="284.0">Identity policy allows?</text>
  <line x1="590" y1="280.0" x2="690" y2="280.0" stroke="#f0545c" stroke-width="1.5"/>
  <text x="640.0" y="274.0" text-anchor="middle" class="s" style="fill:#f0545c">no</text>
  <line x1="410.0" y1="300" x2="410.0" y2="316" stroke="#8b949e" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="418.0" y="313" class="s">yes</text>
  <rect x="230" y="318" width="360" height="40" rx="6" fill="#8b949e" fill-opacity="0.10" stroke="#8b949e"/>
  <circle cx="250" cy="338.0" r="9" fill="#8b949e"/><text x="250" y="342.0" text-anchor="middle" class="n">6</text>
  <text x="268" y="342.0">Permissions boundary allows? (if set)</text>
  <line x1="590" y1="338.0" x2="690" y2="338.0" stroke="#f0545c" stroke-width="1.5"/>
  <text x="640.0" y="332.0" text-anchor="middle" class="s" style="fill:#f0545c">no</text>
  <line x1="410.0" y1="358" x2="410.0" y2="374" stroke="#8b949e" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="418.0" y="371" class="s">yes</text>
  <rect x="230" y="376" width="360" height="40" rx="6" fill="#8b949e" fill-opacity="0.10" stroke="#8b949e"/>
  <circle cx="250" cy="396.0" r="9" fill="#8b949e"/><text x="250" y="400.0" text-anchor="middle" class="n">7</text>
  <text x="268" y="400.0">Session policy allows? (if passed)</text>
  <line x1="590" y1="396.0" x2="690" y2="396.0" stroke="#f0545c" stroke-width="1.5"/>
  <text x="640.0" y="390.0" text-anchor="middle" class="s" style="fill:#f0545c">no</text>
  <line x1="410.0" y1="416" x2="410.0" y2="438" stroke="#8b949e" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="418.0" y="429" class="s">yes</text>
  <line x1="690" y1="48.0" x2="690" y2="438" stroke="#f0545c" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="630" y="440" width="120" height="40" rx="6" fill="#f0545c" fill-opacity="0.18" stroke="#f0545c"/>
  <text x="690" y="465" text-anchor="middle" class="h" style="fill:#f0545c">DENY</text>
  <rect x="350.0" y="440" width="120" height="40" rx="6" fill="#4cc38a" fill-opacity="0.18" stroke="#4cc38a"/>
  <text x="410.0" y="465" text-anchor="middle" class="h" style="fill:#4cc38a">ALLOW</text>
  <path d="M190 222.0 V460 H348.0" fill="none" stroke="#4cc38a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="30" y1="86" x2="30" y2="184" stroke="#38b2ac" stroke-width="3" stroke-linecap="round"/>
  <text x="42" y="133.0" class="s" style="fill:#38b2ac">organization</text>
  <text x="42" y="147.0" class="s" style="fill:#38b2ac">guardrails</text>
  <line x1="30" y1="202" x2="30" y2="300" stroke="#3d86e0" stroke-width="3" stroke-linecap="round"/>
  <text x="42" y="255.0" class="s" style="fill:#3d86e0">grants</text>
  <line x1="30" y1="318" x2="30" y2="416" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
  <text x="42" y="365.0" class="s" style="fill:#8b949e">caps on the</text>
  <text x="42" y="379.0" class="s" style="fill:#8b949e">principal</text>
  <text x="30" y="510" class="s">* only when the policy names the exact user or role session. See the text below.</text>
</svg>
