<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" width="820" height="392" role="img" aria-label="An AWS Organization. The management account administers the root. Under the root are OUs for Security, Infrastructure, Workloads with Prod and Non-prod sub-OUs, and Sandbox, each holding member accounts. SCPs attached at the root, the Security OU and the Prod OU apply to every account below them.">
