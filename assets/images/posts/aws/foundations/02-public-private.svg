<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Three network zones: the internet, the AWS public zone with S3, DynamoDB, SQS and STS endpoints, and your private VPC. The VPC reaches the internet through an internet or NAT gateway, S3 and DynamoDB through a gateway endpoint, and SQS and STS through an interface endpoint.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .aws{fill:#38b2ac} .you{fill:#3d86e0}
    .ep{font-size:11px;fill:#38b2ac}
  </style>
  <rect width="820" height="400" rx="12" fill="#1e2128" stroke="#353b45"/>

  <!-- internet -->
  <rect x="20" y="20" width="780" height="50" rx="8" fill="#252a33" stroke="#4a5260"/>
  <text x="36" y="50" class="h">INTERNET</text>

  <!-- public zone -->
  <rect x="20" y="100" width="780" height="110" rx="8" fill="#38b2ac" fill-opacity="0.06" stroke="#38b2ac"/>
  <text x="36" y="124" class="h aws">AWS PUBLIC ZONE</text>
  <text x="784" y="124" text-anchor="end" class="s">endpoints anyone can reach, IAM decides who gets an answer</text>
  <g>
    <rect x="240" y="142" width="110" height="46" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac"/>
    <text x="295" y="161" text-anchor="middle">S3</text><text x="295" y="178" text-anchor="middle" class="s">IAM check</text>
    <rect x="370" y="142" width="110" height="46" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac"/>
    <text x="425" y="161" text-anchor="middle">DynamoDB</text><text x="425" y="178" text-anchor="middle" class="s">IAM check</text>
    <rect x="520" y="142" width="110" height="46" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac"/>
    <text x="575" y="161" text-anchor="middle">SQS</text><text x="575" y="178" text-anchor="middle" class="s">IAM check</text>
    <rect x="650" y="142" width="110" height="46" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac"/>
    <text x="705" y="161" text-anchor="middle">STS</text><text x="705" y="178" text-anchor="middle" class="s">IAM check</text>
  </g>

  <!-- paths -->
  <line x1="110" y1="236" x2="110" y2="70" stroke="#8b949e" stroke-width="1.5"/>
  <text x="122" y="152" class="s">public route</text>
  <text x="122" y="168" class="s">via internet</text>

  <path d="M360 236 V222 H295 V188 M360 222 H425 V188" fill="none" stroke="#38b2ac" stroke-width="2"/>
  <path d="M640 236 V222 H575 V188 M640 222 H705 V188" fill="none" stroke="#38b2ac" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- vpc -->
  <rect x="20" y="250" width="780" height="130" rx="10" fill="#3d86e0" fill-opacity="0.04" stroke="#3d86e0"/>
  <text x="36" y="286" class="h you">VPC</text>
  <text x="36" y="302" class="s">your private</text>
  <text x="36" y="316" class="s">network</text>

  <rect x="50" y="236" width="120" height="28" rx="5" fill="#1e2128" stroke="#8b949e"/>
  <text x="110" y="254" text-anchor="middle" class="s" style="fill:#e6e6e6">IGW / NAT</text>
  <rect x="294" y="236" width="132" height="28" rx="5" fill="#1e2128" stroke="#38b2ac"/>
  <text x="360" y="254" text-anchor="middle" class="ep">gateway endpoint</text>
  <rect x="568" y="236" width="144" height="28" rx="5" fill="#1e2128" stroke="#38b2ac" stroke-dasharray="5 3"/>
  <text x="640" y="254" text-anchor="middle" class="ep">interface endpoint</text>

  <rect x="240" y="292" width="110" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0"/>
  <text x="295" y="313" text-anchor="middle">EC2</text>
  <rect x="370" y="292" width="110" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0"/>
  <text x="425" y="313" text-anchor="middle">RDS</text>
  <rect x="520" y="292" width="110" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0"/>
  <text x="575" y="313" text-anchor="middle">ECS task</text>
  <rect x="650" y="292" width="110" height="34" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0"/>
  <text x="705" y="313" text-anchor="middle">Lambda</text>

  <text x="240" y="360" class="s">no traffic in or out until you add a path: gateway, NAT, VPN, endpoint</text>
</svg>
