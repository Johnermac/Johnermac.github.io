<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="A role in account A reads a bucket in account B. The request passes two checks: the identity policy in account A and the bucket policy in account B. Both must allow.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/></marker>
    <g id="ok"><circle r="9" fill="#4cc38a"/><path d="M-4 0 L-1 3 L4 -3" fill="none" stroke="#1e2128" stroke-width="2"/></g>
  </defs>
  <rect width="820" height="240" rx="12" fill="#1e2128" stroke="#353b45"/>

  <rect x="24" y="30" width="330" height="160" rx="10" fill="#252a33" stroke="#4a5260"/>
  <text x="40" y="54" class="h">ACCOUNT A</text><text x="338" y="54" text-anchor="end" class="s">caller</text>
  <rect x="44" y="92" width="120" height="36" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0"/>
  <text x="104" y="114" text-anchor="middle">role/app</text>

  <rect x="466" y="30" width="330" height="160" rx="10" fill="#252a33" stroke="#4a5260"/>
  <text x="482" y="54" class="h">ACCOUNT B</text><text x="780" y="54" text-anchor="end" class="s">owner</text>
  <rect x="656" y="92" width="120" height="36" rx="6" fill="#38b2ac" fill-opacity="0.16" stroke="#38b2ac"/>
  <text x="716" y="114" text-anchor="middle">S3 bucket</text>

  <line x1="164" y1="110" x2="652" y2="110" stroke="#e6e6e6" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="250" y="102" text-anchor="middle" class="s">s3:GetObject</text>
  <text x="410" y="102" text-anchor="middle" class="s">both required</text>

  <rect x="349" y="88" width="10" height="44" rx="2" fill="#4cc38a" fill-opacity="0.35" stroke="#4cc38a"/>
  <rect x="461" y="88" width="10" height="44" rx="2" fill="#4cc38a" fill-opacity="0.35" stroke="#4cc38a"/>
  <use href="#ok" x="212" y="152"/><text x="338" y="156" text-anchor="end" class="s">1 identity policy</text>
  <text x="338" y="172" text-anchor="end" class="s">allows the call</text>
  <use href="#ok" x="496" y="152"/><text x="512" y="156" class="s">2 bucket policy</text>
  <text x="512" y="172" class="s">allows role/app</text>

  <text x="24" y="220" class="s">SCPs and RCPs still apply on each side</text>
</svg>
