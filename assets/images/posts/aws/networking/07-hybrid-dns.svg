<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="DNS between a VPC and on-premises. Instances ask the VPC resolver at the base address plus two. It answers from private hosted zones, public DNS, or forwards matching domains through an outbound endpoint to the on-premises DNS server. On-premises clients reach VPC names through an inbound endpoint.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="360" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="190" height="320" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="44" class="h">ON-PREMISES</text>
  <rect x="40" y="210" width="150" height="90" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="115.0" y="252.0" text-anchor="middle" style="fill:#e6e6e6">corporate DNS</text>
  <text x="115.0" y="268.0" text-anchor="middle" class="s">corp.example.com</text>
  <rect x="250" y="20" width="550" height="320" rx="10" fill="none" stroke="#3d86e0" stroke-width="1"/>
  <text x="266" y="44" class="h" style="fill:#3d86e0">VPC</text>
  <rect x="270" y="150" width="90" height="40" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="315.0" y="174.0" text-anchor="middle" style="fill:#a9c8f0">EC2</text>
  <rect x="410" y="136" width="110" height="68" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="465.0" y="167.0" text-anchor="middle" style="fill:#8fdcd7">VPC resolver</text>
  <text x="465.0" y="183.0" text-anchor="middle" class="s">base address + 2</text>
  <line x1="360" y1="170" x2="410" y2="170" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="600" y="60" width="170" height="36" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="685.0" y="82.0" text-anchor="middle" style="fill:#8fdcd7">private hosted zone</text>
  <rect x="600" y="108" width="170" height="36" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="685.0" y="130.0" text-anchor="middle" style="fill:#e6e6e6">public DNS (recursive)</text>
  <line x1="520" y1="150" x2="600" y2="82" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="520" y1="164" x2="600" y2="126" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="560" y="222" width="150" height="40" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="635.0" y="246.0" text-anchor="middle" style="fill:#f5c542">outbound endpoint</text>
  <rect x="560" y="284" width="150" height="40" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="635.0" y="308.0" text-anchor="middle" style="fill:#f5c542">inbound endpoint</text>
  <path d="M465 204 V214 H635 V222" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <line x1="560" y1="242" x2="190" y2="242" stroke="#f5c542" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="345" y="235" text-anchor="middle" class="s">rule: corp.example.com</text>
  <line x1="190" y1="292" x2="560" y2="292" stroke="#f5c542" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="375" y="284" text-anchor="middle" class="s">on-prem forwards aws.example.com</text>
  <path d="M710 304 H748 V188 H520" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="262" y="330" class="s">traffic rides the VPN or Direct Connect link</text>
</svg>
