<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Three ways out of a private subnet to AWS and other services without internet. A gateway endpoint is a route table entry to S3 and DynamoDB. An interface endpoint is a network interface in your subnet that reaches AWS services such as SQS and STS, and services published through PrivateLink such as a provider's load balancer.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="400" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="410" height="360" rx="10" fill="none" stroke="#3d86e0" stroke-width="1"/>
  <text x="36" y="44" class="h" style="fill:#3d86e0">YOUR VPC</text>
  <rect x="36" y="60" width="378" height="300" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="48" y="78" class="s">private subnet, no NAT, no internet gateway</text>
  <rect x="52" y="178" width="90" height="44" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="97.0" y="204.0" text-anchor="middle" style="fill:#a9c8f0">EC2</text>
  <rect x="230" y="96" width="170" height="44" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="315.0" y="115.0" text-anchor="middle" style="fill:#8fdcd7">gateway endpoint</text>
  <text x="315.0" y="131.0" text-anchor="middle" class="s">route table entry</text>
  <rect x="230" y="276" width="170" height="44" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="315.0" y="295.0" text-anchor="middle" style="fill:#8fdcd7">interface endpoint</text>
  <text x="315.0" y="311.0" text-anchor="middle" class="s">ENI + private IP</text>
  <path d="M142 200 H196 V118 H230" fill="none" stroke="#38b2ac" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/>
  <path d="M142 200 H196 V298 H230" fill="none" stroke="#38b2ac" stroke-width="1.8" stroke-dasharray="5 3" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="230" y="158" class="s">S3 and DynamoDB only,</text>
  <text x="230" y="174" class="s">prefix list in route table</text>
  <text x="230" y="338" class="s">private DNS name points</text>
  <text x="230" y="354" class="s">to the ENI's private IP</text>
  <rect x="490" y="20" width="310" height="168" rx="10" fill="none" stroke="#38b2ac" stroke-width="1"/>
  <text x="506" y="44" class="h" style="fill:#38b2ac">AWS SERVICES (regional endpoints)</text>
  <rect x="506" y="60" width="130" height="40" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="571.0" y="84.0" text-anchor="middle" style="fill:#8fdcd7">S3</text>
  <rect x="656" y="60" width="130" height="40" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="721.0" y="84.0" text-anchor="middle" style="fill:#8fdcd7">DynamoDB</text>
  <rect x="506" y="112" width="130" height="40" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="571.0" y="136.0" text-anchor="middle" style="fill:#8fdcd7">SQS</text>
  <rect x="656" y="112" width="130" height="40" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="721.0" y="136.0" text-anchor="middle" style="fill:#8fdcd7">STS, KMS, ...</text>
  <text x="506" y="172" class="s">gateway: S3, DynamoDB. interface: the rest</text>
  <rect x="490" y="212" width="310" height="168" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="506" y="236" class="h">PROVIDER VPC (another account)</text>
  <rect x="506" y="262" width="130" height="40" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="571.0" y="286.0" text-anchor="middle" style="fill:#e6e6e6">NLB</text>
  <rect x="656" y="262" width="130" height="40" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="721.0" y="286.0" text-anchor="middle" style="fill:#e6e6e6">their service</text>
  <line x1="636" y1="282" x2="656" y2="282" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="506" y="330" class="s">PrivateLink: you reach one service,</text>
  <text x="506" y="346" class="s">not the provider's network</text>
  <path d="M400 118 H470 V76 H490" fill="none" stroke="#38b2ac" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/>
  <path d="M400 298 H452 V132 H490" fill="none" stroke="#38b2ac" stroke-width="1.8" stroke-dasharray="5 3" stroke-linejoin="round" marker-end="url(#ar)"/>
  <path d="M452 298 V282 H490" fill="none" stroke="#38b2ac" stroke-width="1.8" stroke-dasharray="5 3" stroke-linejoin="round" marker-end="url(#ar)"/>
</svg>
