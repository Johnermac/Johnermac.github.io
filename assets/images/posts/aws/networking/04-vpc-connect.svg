<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Left, VPC peering: four VPCs need six direct links, and peering is not transitive. Right, Transit Gateway: each VPC, VPN and Direct Connect gets one attachment to a central hub with route tables.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="420" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="385" height="380" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="44" class="h">VPC PEERING</text>
  <line x1="110" y1="115" x2="310" y2="115" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="110" y1="275" x2="310" y2="275" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="110" y1="115" x2="110" y2="275" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="310" y1="115" x2="310" y2="275" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="110" y1="115" x2="310" y2="275" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="310" y1="115" x2="110" y2="275" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="60" y="90" width="100" height="50" rx="6" fill="#1e2128" stroke="#3d86e0" stroke-width="1"/>
  <rect x="60" y="90" width="100" height="50" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="110" y="120" text-anchor="middle" style="fill:#a9c8f0">VPC A</text>
  <rect x="260" y="90" width="100" height="50" rx="6" fill="#1e2128" stroke="#3d86e0" stroke-width="1"/>
  <rect x="260" y="90" width="100" height="50" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="310" y="120" text-anchor="middle" style="fill:#a9c8f0">VPC B</text>
  <rect x="60" y="250" width="100" height="50" rx="6" fill="#1e2128" stroke="#3d86e0" stroke-width="1"/>
  <rect x="60" y="250" width="100" height="50" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="110" y="280" text-anchor="middle" style="fill:#a9c8f0">VPC C</text>
  <rect x="260" y="250" width="100" height="50" rx="6" fill="#1e2128" stroke="#3d86e0" stroke-width="1"/>
  <rect x="260" y="250" width="100" height="50" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="310" y="280" text-anchor="middle" style="fill:#a9c8f0">VPC D</text>
  <text x="36" y="350" class="s">n VPCs need n(n-1)/2 peerings: 6 here, 45 for 10</text>
  <text x="36" y="368" class="s">A to B and B to C do not give A to C</text>
  <text x="36" y="386" class="s">each side adds routes, CIDRs must not overlap</text>
  <rect x="415" y="20" width="385" height="380" rx="10" fill="none" stroke="#38b2ac" stroke-width="1"/>
  <text x="431" y="44" class="h" style="fill:#38b2ac">TRANSIT GATEWAY</text>
  <rect x="505" y="180" width="200" height="60" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="605.0" y="207.0" text-anchor="middle" style="fill:#8fdcd7">Transit Gateway</text>
  <text x="605.0" y="223.0" text-anchor="middle" class="s">route tables per attachment</text>
  <rect x="430" y="72" width="110" height="44" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="485.0" y="98.0" text-anchor="middle" style="fill:#a9c8f0">VPC A</text>
  <line x1="485" y1="116" x2="529.75" y2="180" stroke="#38b2ac" stroke-width="1.5"/>
  <rect x="545" y="72" width="110" height="44" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="600.0" y="98.0" text-anchor="middle" style="fill:#a9c8f0">VPC B</text>
  <line x1="600" y1="116" x2="570.0" y2="180" stroke="#38b2ac" stroke-width="1.5"/>
  <rect x="660" y="72" width="110" height="44" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="715.0" y="98.0" text-anchor="middle" style="fill:#a9c8f0">VPC C</text>
  <line x1="715" y1="116" x2="610.25" y2="180" stroke="#38b2ac" stroke-width="1.5"/>
  <rect x="430" y="304" width="110" height="44" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="485.0" y="330.0" text-anchor="middle" style="fill:#e6e6e6">Site-to-Site VPN</text>
  <line x1="485" y1="304" x2="529.75" y2="240" stroke="#38b2ac" stroke-width="1.5"/>
  <rect x="545" y="304" width="110" height="44" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="600.0" y="330.0" text-anchor="middle" style="fill:#e6e6e6">Direct Connect</text>
  <line x1="600" y1="304" x2="570.0" y2="240" stroke="#38b2ac" stroke-width="1.5"/>
  <rect x="660" y="304" width="110" height="44" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="715.0" y="330.0" text-anchor="middle" style="fill:#8fdcd7">TGW peering</text>
  <line x1="715" y1="304" x2="610.25" y2="240" stroke="#38b2ac" stroke-width="1.5"/>
  <text x="431" y="368" class="s">n VPCs need n attachments</text>
  <text x="431" y="386" class="s">route tables decide who talks to whom</text>
</svg>
