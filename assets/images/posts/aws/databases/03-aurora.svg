<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390" role="img" aria-label="Aurora: the cluster endpoint points to the writer and the reader endpoint spreads connections over the replicas. Writer and replicas sit in three AZs and share one cluster volume that keeps six copies of the data, two in each AZ.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="390" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="120" y="20" width="220" height="50" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="230.0" y="42.0" text-anchor="middle" style="fill:#a9c8f0">Cluster endpoint</text>
  <text x="230.0" y="58.0" text-anchor="middle" class="s">reads and writes</text>
  <rect x="480" y="20" width="220" height="50" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="590.0" y="42.0" text-anchor="middle" style="fill:#a9c8f0">Reader endpoint</text>
  <text x="590.0" y="58.0" text-anchor="middle" class="s">spreads connections</text>
  <rect x="20" y="100" width="250" height="112" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="34" y="122" class="h">AZ A</text>
  <rect x="285" y="100" width="250" height="112" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="299" y="122" class="h">AZ B</text>
  <rect x="550" y="100" width="250" height="112" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="564" y="122" class="h">AZ C</text>
  <rect x="50" y="140" width="190" height="52" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="145.0" y="163.0" text-anchor="middle" style="fill:#8fdcd7">Writer</text>
  <text x="145.0" y="179.0" text-anchor="middle" class="s">instance</text>
  <rect x="315" y="140" width="190" height="52" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="410.0" y="163.0" text-anchor="middle" style="fill:#f5c542">Replica</text>
  <text x="410.0" y="179.0" text-anchor="middle" class="s">instance</text>
  <rect x="580" y="140" width="190" height="52" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="675.0" y="163.0" text-anchor="middle" style="fill:#f5c542">Replica</text>
  <text x="675.0" y="179.0" text-anchor="middle" class="s">instance</text>
  <line x1="230" y1="70" x2="160" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M590 70 C590 105 430 105 420 140" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <line x1="650" y1="70" x2="670" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="245" width="780" height="125" rx="10" fill="none" stroke="#38b2ac" stroke-width="1"/>
  <text x="36" y="269" class="h" style="fill:#38b2ac">CLUSTER VOLUME, SHARED BY ALL INSTANCES</text>
  <rect x="55" y="285" width="85" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="97.5" y="306.0" text-anchor="middle" style="fill:#8fdcd7">copy 1</text>
  <rect x="150" y="285" width="85" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="192.5" y="306.0" text-anchor="middle" style="fill:#8fdcd7">copy 2</text>
  <rect x="320" y="285" width="85" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="362.5" y="306.0" text-anchor="middle" style="fill:#8fdcd7">copy 3</text>
  <rect x="415" y="285" width="85" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="457.5" y="306.0" text-anchor="middle" style="fill:#8fdcd7">copy 4</text>
  <rect x="585" y="285" width="85" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="627.5" y="306.0" text-anchor="middle" style="fill:#8fdcd7">copy 5</text>
  <rect x="680" y="285" width="85" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="722.5" y="306.0" text-anchor="middle" style="fill:#8fdcd7">copy 6</text>
  <text x="36" y="350" class="s">6 copies in 3 AZs, repairs itself, grows on its own</text>
  <line x1="145" y1="192" x2="145" y2="245" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#al)"/>
  <line x1="410" y1="192" x2="410" y2="245" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#al)"/>
  <line x1="675" y1="192" x2="675" y2="245" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#al)"/>
</svg>
