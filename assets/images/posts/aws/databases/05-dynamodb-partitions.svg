<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="DynamoDB hashes each item's partition key to pick a partition. Items with the same partition key sit together, sorted by sort key. A key with many values spreads traffic evenly over partitions; a key with few values sends most traffic to one hot partition.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="400" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="250" height="190" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="44" class="h" style="fill:#3d86e0">ITEMS</text>
  <text x="46" y="70" class="s">partition key</text>
  <text x="151" y="70" class="s">sort key</text>
  <rect x="36" y="82" width="218" height="22" rx="4" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="46" y="97">user#17</text>
  <text x="151" y="97">order#001</text>
  <rect x="36" y="110" width="218" height="22" rx="4" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="46" y="125">user#17</text>
  <text x="151" y="125">order#002</text>
  <rect x="36" y="138" width="218" height="22" rx="4" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="46" y="153">user#42</text>
  <text x="151" y="153">order#001</text>
  <rect x="36" y="166" width="218" height="22" rx="4" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="46" y="181">user#08</text>
  <text x="151" y="181">order#007</text>
  <rect x="305" y="85" width="130" height="60" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="370.0" y="112.0" text-anchor="middle" style="fill:#f5c542">hash of</text>
  <text x="370.0" y="128.0" text-anchor="middle" class="s">partition key</text>
  <line x1="270" y1="115" x2="305" y2="115" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="480" y="20" width="320" height="190" rx="10" fill="none" stroke="#38b2ac" stroke-width="1"/>
  <text x="496" y="44" class="h" style="fill:#38b2ac">PARTITIONS</text>
  <rect x="496" y="60" width="288" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="640.0" y="81.0" text-anchor="middle" style="fill:#8fdcd7">P1  user#17: order#001, 002</text>
  <path d="M435 115 C458 115 460 77 496 77" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="496" y="104" width="288" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="640.0" y="125.0" text-anchor="middle" style="fill:#8fdcd7">P2  user#42: order#001</text>
  <path d="M435 115 C458 115 460 121 496 121" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="496" y="148" width="288" height="34" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="640.0" y="169.0" text-anchor="middle" style="fill:#8fdcd7">P3  user#08: order#007</text>
  <path d="M435 115 C458 115 460 165 496 165" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="496" y="200" class="s">each partition has its own throughput</text>
  <rect x="20" y="230" width="380" height="155" rx="10" fill="none" stroke="#4cc38a" stroke-width="1"/>
  <text x="36" y="254" class="h" style="fill:#4cc38a">MANY KEY VALUES</text>
  <text x="36" y="274" class="s">user ID: load spread over partitions</text>
  <rect x="60" y="325" width="50" height="40" rx="3" fill="#4cc38a" fill-opacity="0.14" stroke="#4cc38a" stroke-width="1"/>
  <text x="85" y="380" text-anchor="middle" class="s">P1</text>
  <rect x="140" y="321" width="50" height="44" rx="3" fill="#4cc38a" fill-opacity="0.14" stroke="#4cc38a" stroke-width="1"/>
  <text x="165" y="380" text-anchor="middle" class="s">P2</text>
  <rect x="220" y="327" width="50" height="38" rx="3" fill="#4cc38a" fill-opacity="0.14" stroke="#4cc38a" stroke-width="1"/>
  <text x="245" y="380" text-anchor="middle" class="s">P3</text>
  <rect x="300" y="323" width="50" height="42" rx="3" fill="#4cc38a" fill-opacity="0.14" stroke="#4cc38a" stroke-width="1"/>
  <text x="325" y="380" text-anchor="middle" class="s">P4</text>
  <rect x="420" y="230" width="380" height="155" rx="10" fill="none" stroke="#f0545c" stroke-width="1"/>
  <text x="436" y="254" class="h" style="fill:#f0545c">FEW KEY VALUES</text>
  <text x="436" y="274" class="s">status or date: one partition hot</text>
  <rect x="460" y="283" width="50" height="82" rx="3" fill="#f0545c" fill-opacity="0.14" stroke="#f0545c" stroke-width="1"/>
  <text x="485" y="380" text-anchor="middle" class="s">P1</text>
  <rect x="540" y="355" width="50" height="10" rx="3" fill="#f0545c" fill-opacity="0.14" stroke="#f0545c" stroke-width="1"/>
  <text x="565" y="380" text-anchor="middle" class="s">P2</text>
  <rect x="620" y="357" width="50" height="8" rx="3" fill="#f0545c" fill-opacity="0.14" stroke="#f0545c" stroke-width="1"/>
  <text x="645" y="380" text-anchor="middle" class="s">P3</text>
  <rect x="700" y="353" width="50" height="12" rx="3" fill="#f0545c" fill-opacity="0.14" stroke="#f0545c" stroke-width="1"/>
  <text x="725" y="380" text-anchor="middle" class="s">P4</text>
</svg>
