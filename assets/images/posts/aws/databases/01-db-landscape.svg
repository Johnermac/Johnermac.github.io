<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="An application writes to operational databases: an in-memory cache, a relational database (RDS, Aurora) and a key-value database (DynamoDB). Data is copied to analytics stores: Redshift as a warehouse and Athena querying files in S3.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="330" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="135" width="140" height="60" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="90.0" y="162.0" text-anchor="middle" style="fill:#a9c8f0">Application</text>
  <text x="90.0" y="178.0" text-anchor="middle" class="s">EC2, ECS, Lambda</text>
  <rect x="195" y="20" width="320" height="290" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="211" y="44" class="h" style="fill:#38b2ac">OPERATIONAL (OLTP)</text>
  <text x="211" y="62" class="s">many small reads and writes, ms</text>
  <rect x="215" y="80" width="280" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="355.0" y="105.0" text-anchor="middle" style="fill:#8fdcd7">In-memory cache</text>
  <text x="355.0" y="121.0" text-anchor="middle" class="s">ElastiCache, DAX: microseconds</text>
  <path d="M160 165 C180 165 185 108 215 108" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="215" y="156" width="280" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="355.0" y="181.0" text-anchor="middle" style="fill:#8fdcd7">Relational</text>
  <text x="355.0" y="197.0" text-anchor="middle" class="s">RDS, Aurora: SQL, joins</text>
  <path d="M160 165 C180 165 185 184 215 184" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="215" y="232" width="280" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="355.0" y="257.0" text-anchor="middle" style="fill:#8fdcd7">Key-value</text>
  <text x="355.0" y="273.0" text-anchor="middle" class="s">DynamoDB: key lookups at scale</text>
  <path d="M160 165 C180 165 185 260 215 260" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <rect x="580" y="20" width="220" height="290" rx="10" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="596" y="44" class="h" style="fill:#f5c542">ANALYTICS (OLAP)</text>
  <text x="596" y="62" class="s">few large scans of history</text>
  <rect x="600" y="100" width="180" height="56" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="690.0" y="125.0" text-anchor="middle" style="fill:#f5c542">Warehouse</text>
  <text x="690.0" y="141.0" text-anchor="middle" class="s">Redshift</text>
  <rect x="600" y="208" width="180" height="56" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="690.0" y="233.0" text-anchor="middle" style="fill:#f5c542">Files in S3</text>
  <text x="690.0" y="249.0" text-anchor="middle" class="s">queried by Athena</text>
  <line x1="515" y1="165" x2="580" y2="165" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="547" y="185" text-anchor="middle" class="s">ETL or</text>
  <text x="547" y="199" text-anchor="middle" class="s">zero-ETL</text>
</svg>
