<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Left: every change to a DynamoDB table goes to its stream, kept 24 hours, and a Lambda function reacts to it. Right: a global table has a replica in each Region; applications write to their nearest replica and changes reach the others, usually within a second.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="330" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="390" height="290" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="44" class="h" style="fill:#f5c542">STREAMS</text>
  <rect x="40" y="64" width="150" height="50" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="115.0" y="86.0" text-anchor="middle" style="fill:#8fdcd7">Table</text>
  <text x="115.0" y="102.0" text-anchor="middle" class="s">insert, modify, remove</text>
  <rect x="240" y="64" width="150" height="50" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="315.0" y="86.0" text-anchor="middle" style="fill:#f5c542">Stream</text>
  <text x="315.0" y="102.0" text-anchor="middle" class="s">24 hours</text>
  <line x1="190" y1="89" x2="240" y2="89" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="240" y="150" width="150" height="46" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="315.0" y="177.0" text-anchor="middle" style="fill:#a9c8f0">Lambda</text>
  <line x1="315" y1="114" x2="315" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="140" width="150" height="30" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="115.0" y="159.0" text-anchor="middle" style="fill:#e6e6e6">Search index</text>
  <line x1="240" y1="173" x2="190" y2="155" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="180" width="150" height="30" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="115.0" y="199.0" text-anchor="middle" style="fill:#e6e6e6">Cache refresh</text>
  <line x1="240" y1="173" x2="190" y2="195" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="220" width="150" height="30" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="115.0" y="239.0" text-anchor="middle" style="fill:#e6e6e6">Audit, analytics</text>
  <line x1="240" y1="173" x2="190" y2="235" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="36" y="278" class="s">ordered per item, each change once</text>
  <rect x="430" y="20" width="370" height="290" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="446" y="44" class="h" style="fill:#38b2ac">GLOBAL TABLES</text>
  <rect x="450" y="70" width="130" height="52" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="515.0" y="93.0" text-anchor="middle" style="fill:#8fdcd7">Replica</text>
  <text x="515.0" y="109.0" text-anchor="middle" class="s">us-east-1</text>
  <rect x="660" y="70" width="130" height="52" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="725.0" y="93.0" text-anchor="middle" style="fill:#8fdcd7">Replica</text>
  <text x="725.0" y="109.0" text-anchor="middle" class="s">eu-west-1</text>
  <rect x="555" y="190" width="140" height="52" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="625.0" y="213.0" text-anchor="middle" style="fill:#8fdcd7">Replica</text>
  <text x="625.0" y="229.0" text-anchor="middle" class="s">ap-south-1</text>
  <line x1="580" y1="96" x2="660" y2="96" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#al)"/>
  <text x="620" y="86" text-anchor="middle" class="s">~1 s</text>
  <line x1="530" y1="122" x2="590" y2="190" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#al)"/>
  <line x1="710" y1="122" x2="660" y2="190" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#al)"/>
  <text x="446" y="270" class="s">read and write in every Region</text>
  <text x="446" y="288" class="s">default: last writer wins</text>
</svg>
