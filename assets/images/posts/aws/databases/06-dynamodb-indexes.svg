<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="One Orders table and two indexes. The table key is customer ID plus order ID. A local secondary index keeps customer ID and sorts by order date. A global secondary index uses status as the partition key, so it can answer which orders are pending across all customers.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="400" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="300" height="300" rx="10" fill="none" stroke="#3d86e0" stroke-width="1"/>
  <text x="34" y="44" class="h" style="fill:#3d86e0">TABLE: ORDERS</text>
  <text x="34" y="70" class="s" style="fill:#f5c542">customer</text>
  <text x="124" y="70" class="s" style="fill:#f5c542">order</text>
  <text x="214" y="70" class="s">status</text>
  <rect x="30" y="80" width="280" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="34" y="97">c#1</text>
  <text x="124" y="97">o#10</text>
  <text x="214" y="97">PAID</text>
  <rect x="30" y="108" width="280" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="34" y="125">c#1</text>
  <text x="124" y="125">o#11</text>
  <text x="214" y="125">PENDING</text>
  <rect x="30" y="136" width="280" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="34" y="153">c#2</text>
  <text x="124" y="153">o#12</text>
  <text x="214" y="153">PENDING</text>
  <rect x="30" y="164" width="280" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="34" y="181">c#3</text>
  <text x="124" y="181">o#13</text>
  <text x="214" y="181">PAID</text>
  <text x="34" y="230" class="s">key: customer + order</text>
  <text x="34" y="248" class="s">query: orders of one customer</text>
  <text x="34" y="266" class="s"></text>
  <text x="34" y="284" class="s">yellow = key attributes</text>
  <rect x="340" y="20" width="220" height="300" rx="10" fill="none" stroke="#38b2ac" stroke-width="1"/>
  <text x="354" y="44" class="h" style="fill:#38b2ac">LSI</text>
  <text x="354" y="70" class="s" style="fill:#f5c542">customer</text>
  <text x="418" y="70" class="s" style="fill:#f5c542">date</text>
  <text x="482" y="70" class="s"></text>
  <rect x="350" y="80" width="200" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="354" y="97">c#1</text>
  <text x="418" y="97">05-02</text>
  <rect x="350" y="108" width="200" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="354" y="125">c#1</text>
  <text x="418" y="125">05-09</text>
  <rect x="350" y="136" width="200" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="354" y="153">c#2</text>
  <text x="418" y="153">05-03</text>
  <rect x="350" y="164" width="200" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="354" y="181">c#3</text>
  <text x="418" y="181">05-07</text>
  <text x="354" y="230" class="s">same partition key,</text>
  <text x="354" y="248" class="s">other sort key</text>
  <text x="354" y="266" class="s">only at table creation</text>
  <text x="354" y="284" class="s">strong reads allowed</text>
  <rect x="580" y="20" width="220" height="300" rx="10" fill="none" stroke="#38b2ac" stroke-width="1"/>
  <text x="594" y="44" class="h" style="fill:#38b2ac">GSI</text>
  <text x="594" y="70" class="s" style="fill:#f5c542">status</text>
  <text x="658" y="70" class="s" style="fill:#f5c542">order</text>
  <text x="722" y="70" class="s"></text>
  <rect x="590" y="80" width="200" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="594" y="97">PAID</text>
  <text x="658" y="97">o#10</text>
  <rect x="590" y="108" width="200" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="594" y="125">PAID</text>
  <text x="658" y="125">o#13</text>
  <rect x="590" y="136" width="200" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="594" y="153">PENDING</text>
  <text x="658" y="153">o#11</text>
  <rect x="590" y="164" width="200" height="24" rx="4" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="594" y="181">PENDING</text>
  <text x="658" y="181">o#12</text>
  <text x="594" y="230" class="s">new partition key</text>
  <text x="594" y="248" class="s">add any time</text>
  <text x="594" y="266" class="s">own capacity</text>
  <text x="594" y="284" class="s">eventually consistent</text>
  <text x="20" y="350" class="s">Query on the LSI: orders of c#1 by date.</text>
  <text x="20" y="370" class="s">Query on the GSI: every PENDING order, any customer.</text>
</svg>
