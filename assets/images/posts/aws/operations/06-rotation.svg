<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="Secret rotation. On a schedule, Secrets Manager invokes a rotation function that creates a new secret version labeled AWSPENDING, sets the new password in the database, tests it, then moves the AWSCURRENT label to the new version. Applications always read AWSCURRENT, so they pick up the new password without a deployment.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="320" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="40" width="190" height="70" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="115.0" y="72.0" text-anchor="middle" style="fill:#8fdcd7">Secrets Manager</text>
  <text x="115.0" y="88.0" text-anchor="middle" class="s">schedule: every 30 days</text>
  <rect x="280" y="20" width="300" height="200" rx="10" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="296" y="44" class="h" style="fill:#a9c8f0">ROTATION FUNCTION</text>
  <rect x="296" y="56" width="268" height="32" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="306" y="77">createSecret</text>
  <text x="554" y="77" text-anchor="end" class="s">new version, AWSPENDING</text>
  <rect x="296" y="96" width="268" height="32" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="306" y="117">setSecret</text>
  <text x="554" y="117" text-anchor="end" class="s">set password in database</text>
  <rect x="296" y="136" width="268" height="32" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="306" y="157">testSecret</text>
  <text x="554" y="157" text-anchor="end" class="s">log in with it</text>
  <rect x="296" y="176" width="268" height="32" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="306" y="197">finishSecret</text>
  <text x="554" y="197" text-anchor="end" class="s">move AWSCURRENT label</text>
  <line x1="210" y1="75" x2="280" y2="75" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="640" y="90" width="160" height="60" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="720.0" y="117.0" text-anchor="middle" style="fill:#8fdcd7">Database</text>
  <text x="720.0" y="133.0" text-anchor="middle" class="s">RDS, Aurora</text>
  <line x1="564" y1="112" x2="640" y2="118" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="564" y1="152" x2="640" y2="132" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="240" width="190" height="60" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="115.0" y="267.0" text-anchor="middle" style="fill:#a9c8f0">Application</text>
  <text x="115.0" y="283.0" text-anchor="middle" class="s">reads AWSCURRENT</text>
  <line x1="115" y1="240" x2="115" y2="110" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="125" y="180" class="s">GetSecretValue</text>
  <path d="M210 270 L720 270 L720 150" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="425" y="262" text-anchor="middle" class="s">connects with the current password</text>
</svg>
