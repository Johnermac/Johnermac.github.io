<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Updating a stack with a change set: edit the template, create a change set, review which resources will be added, modified or replaced, then execute it or delete it. If the update fails, CloudFormation rolls the stack back to its last working state.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="330" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="40" width="170" height="56" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="105.0" y="65.0" text-anchor="middle" style="fill:#a9c8f0">Edit template</text>
  <text x="105.0" y="81.0" text-anchor="middle" class="s">new version in Git</text>
  <rect x="220" y="40" width="170" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="305.0" y="65.0" text-anchor="middle" style="fill:#8fdcd7">Create change set</text>
  <text x="305.0" y="81.0" text-anchor="middle" class="s">CloudFormation diffs</text>
  <line x1="190" y1="68" x2="220" y2="68" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="420" y="40" width="170" height="56" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="505.0" y="65.0" text-anchor="middle" style="fill:#a9c8f0">Review</text>
  <text x="505.0" y="81.0" text-anchor="middle" class="s">add, modify, replace</text>
  <line x1="390" y1="68" x2="420" y2="68" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="620" y="40" width="170" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="705.0" y="65.0" text-anchor="middle" style="fill:#8fdcd7">Execute</text>
  <text x="705.0" y="81.0" text-anchor="middle" class="s">apply the changes</text>
  <line x1="590" y1="68" x2="620" y2="68" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="130" width="570" height="120" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="154" class="h" style="fill:#f5c542">CHANGE SET PREVIEW</text>
  <text x="40" y="182" style="fill:#9be0bf">Add</text>
  <text x="120" y="182">AlarmTopic</text>
  <text x="260" y="182" class="s">new resource</text>
  <text x="40" y="206" style="fill:#f5c542">Modify</text>
  <text x="120" y="206">AppTable</text>
  <text x="260" y="206" class="s">in place, no interruption</text>
  <text x="40" y="230" style="fill:#f4a0a5">Modify</text>
  <text x="120" y="230">WebServer</text>
  <text x="260" y="230" class="s">Replacement: True, new instance and ID</text>
  <line x1="400" y1="96" x2="400" y2="130" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="630" y="140" width="170" height="56" rx="6" fill="#f0545c" fill-opacity="0.14" stroke="#f0545c" stroke-width="1"/>
  <text x="715.0" y="165.0" text-anchor="middle" style="fill:#f4a0a5">Update fails</text>
  <text x="715.0" y="181.0" text-anchor="middle" class="s">automatic rollback</text>
  <line x1="705" y1="96" x2="705" y2="140" stroke="#f0545c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="20" y="290" class="s">Replacement creates the new resource first and deletes the old one, so names, IDs and data on it change.</text>
  <text x="20" y="310" class="s">DeletionPolicy and UpdateReplacePolicy keep or snapshot the old resource.</text>
</svg>
