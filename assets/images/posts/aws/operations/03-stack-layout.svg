<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Two ways to split infrastructure into stacks. Nested stacks: a parent stack creates child stacks for network, database and app, and they are deployed and updated together. Cross-stack references: a separate network stack exports values such as subnet IDs, and app stacks owned by other teams import them, with independent lifecycles.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="330" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="380" height="290" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="36" y="44" class="h" style="fill:#f5c542">NESTED STACKS</text>
  <rect x="130" y="60" width="160" height="50" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="210.0" y="82.0" text-anchor="middle" style="fill:#8fdcd7">Parent stack</text>
  <text x="210.0" y="98.0" text-anchor="middle" class="s">one deployment</text>
  <rect x="40" y="170" width="100" height="46" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="90.0" y="190.0" text-anchor="middle" style="fill:#e6e6e6">Network</text>
  <text x="90.0" y="206.0" text-anchor="middle" class="s">child</text>
  <line x1="210" y1="110" x2="90" y2="170" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="160" y="170" width="100" height="46" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="210.0" y="190.0" text-anchor="middle" style="fill:#e6e6e6">Database</text>
  <text x="210.0" y="206.0" text-anchor="middle" class="s">child</text>
  <line x1="210" y1="110" x2="210" y2="170" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="280" y="170" width="100" height="46" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="330.0" y="190.0" text-anchor="middle" style="fill:#e6e6e6">App</text>
  <text x="330.0" y="206.0" text-anchor="middle" class="s">child</text>
  <line x1="210" y1="110" x2="330" y2="170" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="40" y="258" class="s" style="fill:#4cc38a">+ reuse a template as a component</text>
  <text x="40" y="280" class="s" style="fill:#f0545c">- everything updates together</text>
  <rect x="420" y="20" width="380" height="290" rx="10" fill="none" stroke="#8b949e" stroke-width="1"/>
  <text x="436" y="44" class="h" style="fill:#f5c542">CROSS-STACK REFERENCES</text>
  <rect x="440" y="60" width="160" height="56" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="520.0" y="85.0" text-anchor="middle" style="fill:#8fdcd7">Network stack</text>
  <text x="520.0" y="101.0" text-anchor="middle" class="s">Export: SubnetIds</text>
  <rect x="640" y="150" width="140" height="46" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="710.0" y="170.0" text-anchor="middle" style="fill:#a9c8f0">App stack A</text>
  <text x="710.0" y="186.0" text-anchor="middle" class="s">ImportValue</text>
  <rect x="640" y="210" width="140" height="46" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="710.0" y="230.0" text-anchor="middle" style="fill:#a9c8f0">App stack B</text>
  <text x="710.0" y="246.0" text-anchor="middle" class="s">ImportValue</text>
  <line x1="520" y1="116" x2="640" y2="173" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="520" y1="116" x2="640" y2="233" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="440" y="258" class="s" style="fill:#4cc38a">+ teams deploy on their own</text>
  <text x="440" y="280" class="s" style="fill:#f0545c">- an export in use can't change</text>
</svg>
