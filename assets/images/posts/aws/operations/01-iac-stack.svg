<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="A template in YAML or JSON is submitted to CloudFormation, which creates a stack. Each logical resource in the template, such as WebBucket or AppTable, becomes a physical resource with a real name or ID in the account, and the stack tracks the mapping.">
