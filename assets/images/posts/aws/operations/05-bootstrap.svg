<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Bootstrapping an instance from CloudFormation. CloudFormation launches the instance and waits because of a creation policy. User data runs cfn-init, which reads the Init metadata from the template and installs packages, writes files and starts services. cfn-signal then reports success, and the resource becomes CREATE_COMPLETE. With no signal before the timeout, the stack rolls back. cfn-hup later applies metadata changes.">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6e6e6;font-size:12px}
    .s{font-size:11px;fill:#8b949e}
    .h{font-size:12px;font-weight:700;letter-spacing:1.5px}
    .b{font-weight:700}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="820" height="330" rx="12" fill="#1e2128" stroke="#353b45"/>
  <rect x="20" y="20" width="220" height="44" rx="6" fill="#38b2ac" fill-opacity="0.14" stroke="#38b2ac" stroke-width="1"/>
  <text x="130.0" y="46.0" text-anchor="middle" style="fill:#8fdcd7">CloudFormation</text>
  <line x1="130" y1="64" x2="130" y2="310" stroke="#353b45" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="300" y="20" width="220" height="44" rx="6" fill="#3d86e0" fill-opacity="0.16" stroke="#3d86e0" stroke-width="1"/>
  <text x="410.0" y="46.0" text-anchor="middle" style="fill:#a9c8f0">EC2 instance</text>
  <line x1="410" y1="64" x2="410" y2="310" stroke="#353b45" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="580" y="20" width="220" height="44" rx="6" fill="#8b949e" fill-opacity="0.1" stroke="#8b949e" stroke-width="1"/>
  <text x="690.0" y="46.0" text-anchor="middle" style="fill:#e6e6e6">Template metadata</text>
  <line x1="690" y1="64" x2="690" y2="310" stroke="#353b45" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="130" y1="100" x2="410" y2="100" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="146" cy="88" r="9" fill="#181b20" stroke="#f5c542"/>
  <text x="146" y="92" text-anchor="middle" style="fill:#f5c542">1</text>
  <text x="280.0" y="92" text-anchor="middle" class="s">launch, wait (CreationPolicy)</text>
  <line x1="410" y1="150" x2="690" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="426" cy="138" r="9" fill="#181b20" stroke="#f5c542"/>
  <text x="426" y="142" text-anchor="middle" style="fill:#f5c542">2</text>
  <text x="560.0" y="142" text-anchor="middle" class="s">cfn-init reads Init metadata</text>
  <rect x="330" y="168" width="160" height="44" rx="6" fill="#f5c542" fill-opacity="0.14" stroke="#f5c542" stroke-width="1"/>
  <text x="410" y="186" text-anchor="middle" class="s">packages, files,</text>
  <text x="410" y="202" text-anchor="middle" class="s">commands, services</text>
  <line x1="410" y1="250" x2="130" y2="250" stroke="#4cc38a" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="146" cy="238" r="9" fill="#181b20" stroke="#f5c542"/>
  <text x="146" y="242" text-anchor="middle" style="fill:#f5c542">3</text>
  <text x="280.0" y="242" text-anchor="middle" class="s">cfn-signal: success</text>
  <text x="20" y="285" class="s">4 CREATE_COMPLETE, or rollback</text>
  <text x="20" y="302" class="s">  if no signal before the timeout</text>
  <text x="580" y="285" class="s">cfn-hup polls for metadata</text>
  <text x="580" y="302" class="s">changes and reruns cfn-init</text>
</svg>
